<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oidshaper — maps</title>
    <link rel="stylesheet" href="../cesium/Widgets/widgets.css">
    <style>
        html, body { margin: 0; height: 100%; font-family: sans-serif; }
        #map, #view { position: absolute; inset: 0; width: 100%; height: 100%; }
        #map { z-index: 0; }
        #view { z-index: 1; }
        aside { position: absolute; z-index: 2; top: 12px; left: 12px; background: white; padding: 12px; max-width: min(600px, calc(100% - 204px)); }
        #credits { position: absolute; z-index: 2; bottom: 0; left: 0; background: #ffffffcc; }
    </style>
    <link rel="stylesheet" href="../theme.css">
</head>
<body>
    <div id="map"></div><canvas id="view"></canvas>
    <aside><a href="../">Demos</a> <label>Theme <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label> <label>Map <select id="source">
        <option value="osm">OpenStreetMap</option><option value="topographic">ČÚZK topographic</option>
        <option value="orthophoto">ČÚZK orthophoto</option>
    </select></label> <label><input id="cadastre" type="checkbox">Cadastre</label>
    <label><input id="models" type="checkbox" checked>Models</label>
    <p>Orbit and zoom using the same controls as Hello box. DMR 5G terrain; heights use Bpv consistently for the scene and map.</p></aside>
    <script type="module" src="../../../typescript/demos/maps/main.ts"></script>
</body>
</html>
